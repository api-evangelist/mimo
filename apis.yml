aid: mimo
name: Mimo
description: 'Mimo (short for "Money In, Money Out") is a London- and Stockholm-based
  B2B fintech that gives small and medium-sized businesses a single platform to manage,
  understand and control their cash flow. Founded in 2023, Mimo bundles supplier payments,
  invoice collection, multi-currency accounts, access to working capital and automated
  bookkeeping, and has grown to offer an AI "Associate" that automates recurring accounting
  workflows such as financial close, bank reconciliation, accounts payable and payroll
  for finance teams and accounting firms. Mimo integrates with accounting tools such
  as Xero. It is backed by Northzone, Seedcamp, Cocoa Ventures, Project A and others,
  and has secured a $125M+ embedded-funding partnership with Froda. This profile is
  a company record in the API Evangelist network; Mimo currently publishes no public
  developer API surface.'
